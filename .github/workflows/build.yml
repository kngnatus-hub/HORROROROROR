name: Build Dusk Horror mod jar

on:
  push:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo (our mod source)
        uses: actions/checkout@v4
        with:
          path: modsrc

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Downloads the real, official Forge 1.20.1 MDK fresh from Forge's own
      # server (recommended build 47.4.10) so the build uses Forge's verified
      # build.gradle / Gradle wrapper rather than a hand-written one.
      - name: Download official Forge 1.20.1 MDK
        run: |
          curl -L -o mdk.zip "https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-mdk.zip"
          mkdir mdk
          unzip -q mdk.zip -d mdk

      - name: Overlay our mod source onto the MDK
        run: |
          rm -rf mdk/src
          cp -r modsrc/src mdk/src
          {
            echo ""
            echo "mod_id=duskhorror"
            echo "mod_name=Dusk Horror"
            echo "mod_version=1.0.0"
            echo "mod_group_id=com.duskhorror"
          } >> mdk/gradle.properties

      - name: Build with Gradle
        working-directory: mdk
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: duskhorror-jar
          path: mdk/build/libs/*.jar
